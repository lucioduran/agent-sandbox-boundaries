name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.9'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest -q -m 'not stress'
      - run: python -m build
      - name: Verify installed wheel in isolation
        shell: bash
        run: |
          python -m venv build/smoke
          build/smoke/bin/python -m pip install dist/*.whl
          build/smoke/bin/python -I -c 'import wasmtime; from sandbox_boundaries import run; r = run(bytes(wasmtime.wat2wasm("(module (func (export \"run\") (result i32) i32.const 42))"))); assert (r.status, r.value) == ("ok", 42), r'
