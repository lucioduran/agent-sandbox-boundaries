name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest -q -m 'not stress'
      - run: python -m build
      - name: Verify installed wheel in isolation
        shell: bash
        run: |
          python -m venv build/smoke
          build/smoke/bin/python -m pip install dist/*.whl
          build/smoke/bin/python -I -c 'import wasmtime; from sandbox_boundaries import run; r = run(bytes(wasmtime.wat2wasm("(module (func (export \"run\") (result i32) i32.const 42))"))); assert (r.status, r.value) == ("ok", 42), r'
